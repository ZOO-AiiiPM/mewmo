# Mewmo Apple 工程声明（XcodeGen 真相源，唯一手工配置入口）。
#
# 约束：
#   - 不要手工编辑生成的 Mewmo.xcodeproj —— 一律改本文件后运行 `make generate`。
#   - macOS 与 iOS 共享 `Sources/`，平台差异用 `#if os(...)` 收敛；入口各自独立。
#   - iOS target 同时支持 iPhone(1) 与 iPad(2)（TARGETED_DEVICE_FAMILY）。
name: Mewmo

options:
  bundleIdPrefix: app.mewmo
  latestVersion: "1.0"
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

# Swift Package Manager 依赖（XcodeGen 会解析并接入三个 target）。
# Nuke 13 core 提供 memory/disk cache、LRU DataCache、request coalescing、cancellation 与 async/await；
# 本 Issue 只用 core，不引入 NukeUI/NukeExtensions。
packages:
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 13.0.6

# 无签名：新 target 默认不开代码签名；本地模拟器/应用内构建不依赖证书。
# 构建命令用 CODE_SIGNING_ALLOWED=NO 兜底确保零证书环境可复现。

targets:
  Mewmo-Mac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Entry/macOS
      - path: Resources/macOS
    dependencies:
      - package: Nuke
      - sdk: Security.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_NAME: Mewmo
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "6.0"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Mewmo-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Entry/iOS
      - path: Resources/iOS
    dependencies:
      - package: Nuke
      - sdk: Security.framework
      - sdk: Network.framework
    # 同时支持 iPhone(1) 与 iPad(2)，并锁定 iOS SDK。
    settings:
      base:
        PRODUCT_NAME: Mewmo
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # 共享 macOS unit-test 门禁（ZOO-91）：只编译共享业务模块 + Tests/，
  # 不包含 SwiftUI 启动壳，保证可在 unhosted xctest 运行。
  # canonical sync fixtures 通过 buildPhase: resources 引用仓库内单一副本，不复制。
  #
  # ZOO-92 起为「可扩展清单」：这里显式列出进入测试编译域的基础模块源码目录
  # （Data + Image）。后续基础模块（如 Sources/Auth）只需在下方追加一行即可接入，
  # 不必重排 test target 或触碰生成的 xcodeproj —— 杜绝「每个模块都复制一套 source list」。
  Mewmo-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Data     # ZOO-91 SwiftData 本地数据层
      - path: Sources/Image    # ZOO-92 图片缓存基础设施（Nuke composition）
      - path: Sources/Auth     # ZOO-93 原生 bearer session / Keychain 基础设施
      - path: Sources/Sync     # ZOO-95 local-first pull/push coordinator
      - path: Sources/MacShell # ZOO-94 macOS local-preview shell
      - path: Sources/MacContent # ZOO-96 Mac clips and feeds local UI state
      - path: Tests
      # canonical sync fixtures（仓库内单一副本，不复制）：作为资源打进 test bundle。
      - path: ../../packages/sync/src/fixtures
        buildPhase: resources
    dependencies:
      - package: Nuke
      - sdk: Security.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: app.mewmo.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO

# XcodeGen 自动为每个 target 生成 scheme，同名即可被 xcodebuild -scheme 引用。
