# Mewmo Apple 工程声明（XcodeGen 真相源，唯一手工配置入口）。
#
# 约束：
#   - 不要手工编辑生成的 Mewmo.xcodeproj —— 一律改本文件后运行 `make generate`。
#   - macOS 与 iOS 共享 `Sources/`，平台差异用 `#if os(...)` 收敛；入口各自独立。
#   - iOS target 同时支持 iPhone(1) 与 iPad(2)（TARGETED_DEVICE_FAMILY）。
name: Mewmo

options:
  bundleIdPrefix: app.mewmo
  latestVersion: "1.0"
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

# 无签名：新 target 默认不开代码签名；本地模拟器/应用内构建不依赖证书。
# 构建命令用 CODE_SIGNING_ALLOWED=NO 兜底确保零证书环境可复现。

targets:
  Mewmo-Mac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Entry/macOS
      - path: Resources/macOS
    settings:
      base:
        PRODUCT_NAME: Mewmo
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "6.0"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Mewmo-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Entry/iOS
      - path: Resources/iOS
    # 同时支持 iPhone(1) 与 iPad(2)，并锁定 iOS SDK。
    settings:
      base:
        PRODUCT_NAME: Mewmo
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # 共享 macOS unit-test 门禁（ZOO-91）：只编译数据层 + Tests/，
  # 不包含 SwiftUI 启动壳，保证数据模型不依赖 SwiftUI、可在 unhosted xctest 运行。
  # canonical sync fixtures 通过 buildPhase: resources 引用仓库内单一副本，不复制。
  Mewmo-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Data
      - path: Tests
      # canonical sync fixtures（仓库内单一副本，不复制）：作为资源打进 test bundle。
      - path: ../../packages/sync/src/fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: app.mewmo.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO

# XcodeGen 自动为每个 target 生成 scheme，同名即可被 xcodebuild -scheme 引用。
